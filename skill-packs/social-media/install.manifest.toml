schema_version = 1
manifest_type = "social-media-install"
project_id = "social-media"
display_name = "社群媒體管理工作流"
entrypoint = "INSTALL.md"
checked_on = "2026-09-05"
status = "local_candidate_first_skill"
installable = true
requires_network = false
support_level = "first_skill_installable_candidate_not_formally_supported"
license_spdx = "Apache-2.0"

[runtime]
local_strategy_requires_network = false
platform_capability_refresh_requires_network = true
external_account_actions_require_explicit_authorization = true

[installation]
candidate_version = "0.1.0"
manager = "scripts/manage_install.py"
manager_requires_python = ">=3.11"
manager_network_access = false
state_schema_version = 1
conflict_policy = "stop_without_overwrite"
managed_entries = ["social-media-setup"]

[workspace]
configuration_manager = "skills/social-media-setup/scripts/manage_workspace.py"
configuration_schema = "skills/social-media-setup/references/social-media-config.schema.json"
configuration_schema_version = 3
state_schema = "skills/social-media-setup/references/setup-state.schema.json"
template_path = "skills/social-media-setup/assets/default-config.json"
configuration_target = "<workspace>/social-media/config.json"
state_target = "<workspace>/.local/social-media/setup-state.json"
credential_policy = "never_store_in_skill_template_general_config_or_setup_state"

[credential_storage]
helper = "skills/social-media-setup/scripts/credential_store.py"
registry_schema = "skills/social-media-setup/references/credential-references.schema.json"
registry_schema_version = 2
terminal_helper = "skills/social-media-setup/scripts/credential_terminal.py"
registry_target = "<workspace>/.local/social-media/credential-references.json"
default_macos_backend = "macos-keychain"
default_windows_backend = "windows-credential-manager"
unsupported_os_policy = "stop_without_plaintext_fallback"
interactive_input = "visible_terminal_hidden_prompt"
secret_cli_output = false

[acceptance_policy]
live_acceptance = "deferred_until_all_toolboxes_complete"
default_tests = "fictional_local_only"
native_test_opt_in = "SOCIAL_NATIVE_ACCEPTANCE=1"

[oauth_runtime]
entrypoint = "skills/social-media-setup/scripts/oauth_callback.py"
engine = "skills/social-media-setup/scripts/oauth_runtime.py"
transport = "skills/social-media-setup/scripts/oauth_http.py"
state_schema = "skills/social-media-setup/references/oauth-state.schema.json"
routes = ["facebook", "youtube"]
facebook_flow = "web_server_https_code_exchange_selected_page_token"
youtube_flow = "desktop_loopback_pkce_code_exchange_refresh"
status = "implemented_fictional_tests_live_deferred"

[implementation_gaps]
instagram_threads_oauth_adapters = "not_implemented_do_not_reuse_facebook_runtime"
messenger_webhook_and_message_actions = "not_implemented_in_setup_requires_community_skill_and_authorized_infrastructure"

[registrations.agents_workspace]
clients = ["codex", "google-antigravity-desktop", "google-antigravity-cli"]
scope = "workspace"
path = "<workspace>/.agents/skills"

[registrations.claude_workspace]
clients = ["claude-code"]
scope = "workspace"
path = "<workspace>/.claude/skills"

[registrations.codex_user]
clients = ["codex"]
scope = "user"
path = "$HOME/.agents/skills"

[registrations.claude_user]
clients = ["claude-code"]
scope = "user"
path = "$HOME/.claude/skills"

[registrations.antigravity_desktop_user]
clients = ["google-antigravity-desktop"]
scope = "user"
path = "$HOME/.gemini/config/skills"

[registrations.antigravity_cli_user]
clients = ["google-antigravity-cli"]
scope = "user"
path = "$HOME/.gemini/antigravity-cli/skills"

[[skills]]
id = "social-media-setup"
source_path = "skills/social-media-setup"
required = true
