schema_version = 1
manifest_type = "website-building-install"
project_id = "website-building"
display_name = "官網打造工作流"
entrypoint = "INSTALL.md"
checked_on = "2026-09-05"
status = "local_candidate_partial_pack"
installable = true
requires_network = false
support_level = "partial_pack_installable_candidate_not_formally_supported"
license_spdx = "Apache-2.0"
decision_record = "../../docs/decisions/0003-website-building-workflow.md"

[agent_execution]
default_mode = "agent_executes_human_authorizes"
human_touchpoints = "docs/human-touchpoints.md"
single_intake = true
batch_confirmation = true
accept_all_defaults_phrase = "全部用預設"
external_actions_require_preview_authorization_readback = true

[runtime]
local_setup_requires_network = false
template_install_requires_network = true
style_download_requires_network = true
cloudflare_actions_require_network = true
external_account_actions_require_explicit_authorization = true

[installation]
candidate_version = "0.3.0"
manager = "scripts/manage_install.py"
manager_requires_python = ">=3.11"
manager_network_access = false
state_schema_version = 1
conflict_policy = "stop_without_overwrite"
managed_entries = ["website-setup", "website-design-preview", "website-build"]

[workspace]
configuration_manager = "skills/website-setup/scripts/manage_workspace.py"
configuration_schema = "skills/website-setup/references/website-config.schema.json"
configuration_schema_version = 1
state_schema = "skills/website-setup/references/setup-state.schema.json"
template_path = "skills/website-setup/assets/default-config.json"
configuration_target = "<workspace>/website/config.json"
state_target = "<workspace>/.local/website/setup-state.json"
credential_policy = "never_store_in_skill_template_general_config_or_setup_state"
optional_default_sources = [
  "sources/strategy/solopreneur-profile.md",
  "social-media/config.json",
]

[hosting]
provider = "cloudflare_workers_static_assets"
plan = "free"
default_deploy_route = "wrangler_local"
optional_deploy_route = "workers_builds_git"
default_public_hostname = "workers.dev_subdomain"
api_token_policy = "never_stored_by_pack_wrangler_oauth_login_only"
domain_routes = ["none_use_workers_dev", "cloudflare_registrar", "external_registrar_add_site", "existing_on_cloudflare"]
boundary_document = "docs/cloudflare-boundary.md"

[style_sources]
bundled_themes = "template/src/themes"
bundled_theme_count = 6
bundled_theme_model = "one_complete_theme_per_tonality_not_color_swap"
bundled_license_spdx = "Apache-2.0"
default_path = "bundled_themes_local_gallery_no_network"
gallery_script = "skills/website-design-preview/scripts/style_gallery.py"
gallery_previews = "skills/website-design-preview/assets/previews"
gallery_export_script = "skills/website-design-preview/scripts/export_previews.py"
gallery_target = "<workspace>/.local/website/style-gallery/index.html"
design_target = "<workspace>/website/design.json"
guide_library = "nexu-io/open-design"
guide_library_commit = "50e305dff2b64d9dc0220e5dfa5d8c98ba4364e3"
guide_library_license = "Apache-2.0"
guides_used = ["claude", "linear-app", "vercel", "apple", "figma", "wired"]
format_specification = "google-labs-code/design.md"
extended_sources_policy = "optional_after_explicit_authorization_and_pinning"
presentation = "six_tonalities_no_brand_name_defaults"
inclusion_threshold_license = "osi_approved"
inclusion_threshold_stars = 10000
inclusion_threshold_or = "major_vendor_publication"
inclusion_threshold_activity_days = 90
inclusion_threshold_pinning = "fixed_commit_or_version"
inclusion_threshold_assets = "no_brand_images_or_font_files"

[template]
path = "template/"
name = "solo-site-starter"
license_spdx = "Apache-2.0"
lockfile = "template/package-lock.json"
install_command = "npm ci"
build_command = "npm run build"
node_engine = ">=20.0.0"
optional_pages = ["portfolio", "case_studies", "pricing", "faq", "newsletter"]
themes = ["bookshop", "nightshift", "gallery", "showroom", "playground", "broadsheet"]
theme_switch = "site.config.mjs theme field; astro.config.mjs maps @theme alias"
fonts_default = "google"
fonts_off_switch = "site.config.mjs fonts = 'system'"
fonts_privacy_note = "google mode requests fonts.googleapis.com and fonts.gstatic.com; documented in template README and data boundaries"
sample_photos_dir = "template/public/images/samples"
sample_photos_manifest = "template/public/images/samples/photos.json"
sample_photos_license = "Unsplash License"
sample_photos_license_url = "https://unsplash.com/license"
sample_photos_source_service = "https://picsum.photos"
sample_photos_replace_before_launch = true
scaffold_script = "skills/website-build/scripts/scaffold_site.py"
check_script = "skills/website-build/scripts/check_site.py"
fictional_brand = true

[acceptance_policy]
live_acceptance = "deferred_until_all_toolboxes_complete"
default_tests = "fictional_local_only"
node_build_test_opt_in = "WEBSITE_NODE_ACCEPTANCE=1"

[registrations.agents_workspace]
clients = ["codex", "google-antigravity-desktop", "google-antigravity-cli"]
scope = "workspace"
path = "<workspace>/.agents/skills"

[registrations.claude_workspace]
clients = ["claude-code"]
scope = "workspace"
path = "<workspace>/.claude/skills"

[registrations.codex_user]
clients = ["codex"]
scope = "user"
path = "$HOME/.agents/skills"

[registrations.claude_user]
clients = ["claude-code"]
scope = "user"
path = "$HOME/.claude/skills"

[registrations.antigravity_desktop_user]
clients = ["google-antigravity-desktop"]
scope = "user"
path = "$HOME/.gemini/config/skills"

[registrations.antigravity_cli_user]
clients = ["google-antigravity-cli"]
scope = "user"
path = "$HOME/.gemini/antigravity-cli/skills"

[[skills]]
id = "website-setup"
source_path = "skills/website-setup"
required = true
install_order = 10
