schema_version = 2
manifest_type = "google-automation-install"
project_id = "google-automation"
display_name = "Google 工具自動化"
entrypoint = "INSTALL.md"
checked_on = "2026-09-13"
status = "ready_for_external_acceptance"
installable = true
requires_network = false
support_level = "installable_candidate_not_formally_supported"

[mvp]
implementation_policy = "reuse_learn_gas_and_add_only_cross_route_gap"
public_skill = "google-workflow-router"
apps_script_source_policy = "toolbox_bundled_single_source"
google_cloud_scope = "routing_and_local_preparation_not_remote_provisioning"
release_policy = "manual_version_snapshots_without_private_workflow_sync"
out_of_scope = [
  "workspace_marketplace_add_ons",
  "google_chat_apps",
  "admin_sdk_domain_wide_delegation",
  "public_multitenant_oauth_verification",
  "production_sla_and_compliance",
  "automatic_google_cloud_provisioning_or_deployment",
]

[integration.learn_gas]
decision = "maintained_in_toolbox_only"
decision_record = "docs/single-source.md"
repository = "https://github.com/iamraven-tw/Learn-GAS"
ref = "7d50a7bfcfbe41ea9d88c2aef8f11200871433a3"
tree = "ef6e45626d59ae18745eb5c7245de0b3f2e48cc9"
license = "MIT"
license_sha256 = "39106e322b00c852430a6e6fca5f93b1465b24a6abd8a6d723df99ae9d2eaa15"
vendor_source = true
auto_update = false
upstream_validation = "python3 scripts/validate_skills.py"
provenance_only = true

[installation]
kind = "ai_agent_executed_local_source_registration"
candidate_version = "0.2.0"
manager = "scripts/manage_install.py"
manager_requires_python = ">=3.11"
manager_network_access = false
default_state_root_macos = "$HOME/Library/Application Support/ai-workflow-toolbox/google-automation"
state_root_policy = "explicit_path_outside_any_agent_skill_scan_root"
registration = "verified_directory_and_file_copy"
modifies_shell_profile = false
modifies_google_account = false
modifies_cloud_resources = false
existing_entry_conflict_policy = "stop_without_overwrite"
state_policy = "store_only_paths_versions_hashes_and_validation_results"
managed_entries = [
  "google-workflow-router",
  "google-apps-script-project-development",
  "google-apps-script-teaching",
  "google-apps-script-debugging",
  "google-docs-layout",
  "learner-facing-terminology.md",
]

[managed_sources]
router_path = "skills/google-workflow-router"
learn_gas_skills = [
  "google-apps-script-project-development",
  "google-apps-script-teaching",
  "google-apps-script-debugging",
  "google-docs-layout",
]
learn_gas_shared_files = ["learner-facing-terminology.md"]

[registrations.agents_workspace]
clients = ["codex", "google-antigravity"]
scope = "workspace"
path = "<workspace>/.agents/skills"

[registrations.claude_workspace]
clients = ["claude-code"]
scope = "workspace"
path = "<workspace>/.claude/skills"

[registrations.codex_user]
clients = ["codex"]
scope = "user"
path = "$HOME/.agents/skills"

[registrations.claude_user]
clients = ["claude-code"]
scope = "user"
path = "$HOME/.claude/skills"

[registrations.antigravity_user]
clients = ["google-antigravity"]
scope = "user"
path = "$HOME/.gemini/config/skills"

[[client_targets]]
id = "codex"
workspace_path = "<workspace>/.agents/skills"
user_path = "$HOME/.agents/skills"
official_documentation = "https://learn.chatgpt.com/docs/build-skills"
discovery_status = "pending_current_release_discovery"

[[client_targets]]
id = "claude-code"
workspace_path = "<workspace>/.claude/skills"
user_path = "$HOME/.claude/skills"
official_documentation = "https://code.claude.com/docs/en/slash-commands"
discovery_status = "pending_current_release_discovery"

[[client_targets]]
id = "google-antigravity"
workspace_path = "<workspace>/.agents/skills"
user_path = "$HOME/.gemini/config/skills"
official_documentation = "https://antigravity.google/docs/skills"
discovery_status = "pending_current_release_discovery"

[lifecycle]
repeat_install = "verify_source_and_active_hashes_then_no_op"
conflict = "stop_on_unknown_symlink_file_directory_or_modified_managed_entry"
update = "snapshot_active_entries_then_transactionally_replace_from_new_verified_sources"
rollback = "restore_latest_verified_history_snapshot"
remove = "move_only_verified_managed_entries_to_recoverable_quarantine"
source_repository_removal = "separate_explicit_action_not_performed_by_manager"
google_resource_removal = "never"

[environment]
locally_tested = [
  "macos-26.5.1-arm64",
  "python-3.14.7",
  "git-2.52.0",
  "codex-cli-0.144.1",
  "claude-code-2.1.206",
  "antigravity-cli-1.1.22-not-signed-in",
]
officially_supported = []

[[dependencies]]
id = "google-clasp"
role = "apps_script_project_cli_installed_only_by_learn_gas_per_project"
required = false
source_type = "official_npm_package"
source = "https://registry.npmjs.org/@google%2fclasp/3.4.1"
upstream = "https://github.com/google/clasp"
observed_ref = "3.4.1"
observed_node_engine = ">=20.0.0"
observed_integrity = "sha512-92wlpu0loC9t4oADuTyJOxQm6T4H2dOD9oQ+BvdFJuzM2uP7cK5dGrrJQhb/m/HLbaR0UOsBXBqRlYbfyR9jbA=="
license = "Apache-2.0"
version_policy = "query_official_metadata_then_pin_compatible_version_per_user_project"
status = "reference_only_not_installed_by_toolbox_pack"

[[official_references]]
id = "apps-script-quotas"
url = "https://developers.google.com/apps-script/guides/services/quotas"
checked_on = "2026-08-31"

[[official_references]]
id = "workspace-credentials"
url = "https://developers.google.com/workspace/guides/create-credentials"
checked_on = "2026-08-31"

[[official_references]]
id = "oauth-policy"
url = "https://developers.google.com/identity/protocols/oauth2/policies"
checked_on = "2026-08-31"

[[official_references]]
id = "cloud-run-overview"
url = "https://cloud.google.com/run/docs/overview/what-is-cloud-run"
checked_on = "2026-08-31"

[[official_references]]
id = "cloud-run-webhooks"
url = "https://cloud.google.com/run/docs/triggering/webhooks"
checked_on = "2026-08-31"

[[official_references]]
id = "cloud-run-scheduler"
url = "https://cloud.google.com/run/docs/triggering/using-scheduler"
checked_on = "2026-08-31"

[[readiness_gates]]
id = "manifest_docs_privacy_license"
status = "complete"

[[readiness_gates]]
id = "bundled_source_and_course_tests"
status = "complete"

[[readiness_gates]]
id = "install_repeat_conflict_update_rollback_remove"
status = "complete"

[[readiness_gates]]
id = "agent_discovery"
status = "structure_verified_new_release_discovery_pending"

[[readiness_gates]]
id = "external_machine_google_acceptance"
status = "pending_user_acceptance_on_separate_computer_or_account"
