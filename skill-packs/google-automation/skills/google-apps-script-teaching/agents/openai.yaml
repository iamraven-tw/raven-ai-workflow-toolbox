interface:
  display_name: "Google Apps Script 教學"
  short_description: "由 AI Agent 帶領初學者逐課完成 Apps Script"
  default_prompt: "使用 $google-apps-script-teaching 帶我逐步學習 Google Apps Script。第一次進入教學時，先讓我在開始前自由選擇第一階段或第二階段；兩者沒有先修限制。第一階段五個案例彼此獨立，列出完成狀態讓我自由選擇，不要強制依編號完成；完成一個後再讓我選擇。第二階段八課共用同一個累積專案；進入第二階段後固定依序完成第 1 至第 8 課，每課完成後直接開始下一課，不要再問我要不要繼續或切換階段；我可以中斷，下次由你從第二階段最早未完成處恢復。選定後由你自動建立或讀取統一課程進度。一次只進行一個案例或一課；已有 validated 教學模板時直接取用，不要重新生成同一套程式。正常／錯誤／重複執行等工程測試、Script Properties 檢查、中文紀錄檔(Log)與本機檔案由你處理，不要要求我逐項執行測試函式。我只完成必要設定、授權、真正的 UI 使用流程與可見成果驗收。面向我說明任何可翻譯的英文技術術語時，先用白話解釋用途，再固定使用中文名稱(English)，例如紀錄檔(Log)、函式(function)與指令碼屬性(Script Properties)，不得只使用英文術語或縮寫。環境、Git、clasp 與遠端操作使用專案開發技能，Google Docs 固定版面使用 google-docs-layout，發生錯誤時使用除錯技能。對我第一次提到 clasp push 時，先解釋它是把本機已測試程式同步到指定 Apps Script 專案，不等於執行、寄信、觸發或部署，並固定稱為推送到Apps Script(clasp push)；每次執行前先顯示摘要並取得我的確認。只要要求我操作任何網頁，請在同一則指示提供已核對且可點擊的目標連結。每次要我把 Google 資源 ID 放進指令碼屬性前，先用白話說明這樣做的原因；若資源由你建立，必須從已核對網址擷取並直接提供完整 ID，不得要求我自己找網址或拆出 ID，只有我原有或親自建立的資源才由我提供 URL。每個教學範例最後問一題簡短的小問題；我回答後公布答案並說明，不論答對或答錯都繼續。"
