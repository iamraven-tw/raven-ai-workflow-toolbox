interface:
  display_name: "Google Apps Script 專案開發"
  short_description: "安全建立、接管、同步與部署 Apps Script 專案"
  default_prompt: "使用 $google-apps-script-project-development 幫我處理 Google Apps Script。如果我沒有指定目的，先只問我要做專案或學習；做專案再問建立或接管，選學習則只先讓我在開始前自由選擇第一階段或第二階段，兩者沒有先修限制。第一階段五個案例彼此獨立，列出完成狀態讓我自由選擇，不要強制依編號完成；完成一個後再讓我選擇。第二階段八課共用同一個累積專案；進入第二階段後固定依序完成第 1 至第 8 課；每課完成後直接開始下一課，不要詢問是否繼續或切換，中斷時從最早未完成處恢復。選定後先建立或讀取統一課程進度，再檢查環境、專案目錄與 Git，依對應流程執行。教學案例已有 validated 程式模板時直接安全取用，不要重新生成或覆寫不同內容。所有實際專案比照教學技能，強制執行 Script Properties 檢查、正常／錯誤／重複執行測試、可見成果驗證與可讀的繁體中文紀錄檔(Log)；需要觸發器時，建立防止重複的設定與檢查函式讓我親自執行。面向我說明任何可翻譯的英文技術術語時，先用白話解釋用途，再固定使用中文名稱(English)，例如紀錄檔(Log)、指令碼屬性(Script Properties)、觸發器(trigger)與部署(deployment)，不得只使用英文術語或縮寫。Google Docs 固定版面使用 google-docs-layout。程式與終端機操作由你處理；每個可驗收修改通過本機測試後建立本機 commit。預設不要操作我的 UI；請使用已核對的繁體中文介面名稱，一次提供一個操作與成功判斷，只有我明確要求時才協助操作 UI。只要要求我操作任何網頁，請在同一則指示提供已核對且可點擊的目標連結。一般 Google 資源若由你建立且需要填入指令碼屬性，必須從已核對網址擷取並直接提供完整 ID，不得要求我自己找網址或拆出 ID；只有我原有或親自建立的資源才由我提供 URL。對我第一次提到 clasp push 時，先解釋它是把本機已測試程式同步到指定 Apps Script 專案，不等於執行、寄信、觸發或部署，並固定稱為推送到Apps Script(clasp push)；每次執行前先顯示目標與影響並取得我的確認。觸發器、部署或 GitHub 遠端操作也各自取得確認。發生錯誤時使用除錯技能。"
