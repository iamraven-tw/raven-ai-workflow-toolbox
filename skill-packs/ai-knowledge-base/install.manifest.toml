schema_version = 1
manifest_type = "my-real-second-brain-install"
project_id = "my-real-second-brain"
display_name = "My Real Second Brain"
entrypoint = "INSTALL.md"
checked_on = "2026-10-31"
requires_network = true
status = "ready_for_external_acceptance"
installable = true
support_level = "installable_candidate_not_formally_supported"

[defaults]
self_skill_scope = "user"
provider_skill_scope = "project"
skill_target = "agents"
package_manager = "uv"
provider_version_policy = "latest_after_standard_external_source_notice"
provider_tested_versions_are_reference_only = true
conflict_policy = "stop_and_ask"

[workspace]
template_path = "template"
sources_template_path = "template/sources"
target = "user_selected_project"
copy_policy = "merge_missing_preserve_existing_stop_on_type_conflict"
required_directories = [
  "sources/strategy",
  "sources/book-notes",
  "sources/references",
  "sources/inbox",
  "sources/external",
  "sources/rag/scripts",
  "sources/wiki",
  "sources/graphify-out",
]

[installation]
candidate_version = "0.2.0"
manager = "scripts/manage_install.py"
state_schema_version = 1
managed_entries = [
  "my-real-second-brain-setup",
  "solopreneur-profile",
  "book-notes",
  "knowledge-source-retrieval",
  "socratic-dialogue",
]

[registrations.agents_workspace]
clients = ["codex", "google-antigravity-desktop", "google-antigravity-cli"]
scope = "workspace"
path = "<workspace>/.agents/skills"

[registrations.claude_workspace]
clients = ["claude-code"]
scope = "workspace"
path = "<workspace>/.claude/skills"

[registrations.codex_user]
clients = ["codex"]
scope = "user"
path = "$HOME/.agents/skills"

[registrations.claude_user]
clients = ["claude-code"]
scope = "user"
path = "$HOME/.claude/skills"

[registrations.antigravity_desktop_user]
clients = ["google-antigravity-desktop"]
scope = "user"
path = "$HOME/.gemini/config/skills"

[registrations.antigravity_cli_user]
clients = ["google-antigravity-cli"]
scope = "user"
path = "$HOME/.gemini/antigravity-cli/skills"

[[skills]]
id = "my-real-second-brain-setup"
source_path = "skills/my-real-second-brain-setup"
required = true
install_scope = "user"
install_order = 30

[[skills]]
id = "solopreneur-profile"
source_path = "skills/solopreneur-profile"
required = true
install_scope = "user"
install_order = 31

[[skills]]
id = "book-notes"
source_path = "skills/book-notes"
required = true
install_scope = "user"
install_order = 32

[[skills]]
id = "knowledge-source-retrieval"
source_path = "skills/knowledge-source-retrieval"
required = true
install_scope = "user"
install_order = 33

[[skills]]
id = "socratic-dialogue"
source_path = "skills/socratic-dialogue"
required = true
install_scope = "user"
install_order = 34

[[providers]]
id = "graphify"
role = "knowledge_structure"
package = "graphifyy"
version = "latest"
tested_version = "0.9.35"
package_spec = "graphifyy"
source = "https://pypi.org/project/graphifyy/"
source_version = "https://pypi.org/project/graphifyy/0.9.35/"
upstream = "https://github.com/Graphify-Labs/graphify"
upstream_release = "https://github.com/Graphify-Labs/graphify/releases/tag/v0.9.35"
upstream_tag = "v0.9.35"
upstream_commit = "9f25a3aaa1050913c2d8a1b9f0b0f0ed18296abd"
license_spdx = "Apache-2.0"
license_url = "https://github.com/Graphify-Labs/graphify/blob/v0.9.35/LICENSE"
wheel_sha256 = "97f5aa68a2779fe0bf14ce0419c3bfa42afeca2f4dc0c3db93b922c191f6967f"
tier = "C"
version_policy = "latest"
tier_reason = "PyPI 套件與間接依賴無法封存；不是工具包的一部分，告知後安裝最新版"
external_source_notice = "standard"
sdist_sha256 = "a972d4b0ae73b0bbca1b5a56f0053b2a57a99f9b6f5f8437205c8a0d1f1d5f12"
latest_observed = "0.9.99"
latest_source_version = "https://pypi.org/project/graphifyy/0.9.99/"
latest_release = "https://github.com/Graphify-Labs/graphify/releases/tag/v0.9.99"
latest_checked_on = "2026-10-31"
version_decision = "install_latest_per_adr_0006_tested_version_recorded_for_reference"
support_status = "optional_pinned_candidate_requires_external_acceptance"
install_method = "uv_tool_install_latest"
install_order = 40
skill_install_order = 50
skill_install_scope = "project"
skill_install_templates = [
  "graphify install --project --platform agents",
  "graphify install --project --platform codex",
]
verify_commands = ["graphify --version"]
replaceable = true

[[providers]]
id = "local_rag"
role = "grounded_retrieval"
replaces = ["notebook"]
implementation = "first_party_scripts"
scripts_template_path = "template/sources/rag/scripts"
workspace_scripts_path = "sources/rag/scripts"
venv_path = "sources/rag/.venv"
index_path = "sources/rag/lancedb"
inbox_path = "sources/inbox"
external_path = "sources/external"
wiki_stub_pattern = "sources/wiki/ext_*.md"
ingest_command = "sources/rag/.venv/bin/python sources/rag/scripts/ingest.py"
query_command = "sources/rag/.venv/bin/python sources/rag/scripts/query.py \"<問題>\" -k 5"
external_min_chars = 6000
chunk_chars = 700
chunk_overlap_chars = 120
default_query_mode = "hybrid"
embedding_model = "qwen3-embedding:4b"
query_prefix_handled_by = "query.py"
keep_alive = "2m"
target_platform = "macos"
other_platforms = "not_yet_verified_report_and_ask"
recommended_ram_gb = 16
measured_ram_active_gb = 3.1
measured_ram_idle_mb = 40
measured_reference_note = "docs/integrations/local-rag.md 的「參考紀錄：維護者單機實測」；只供參考，不是效能保證"
requires_user_login = false
uploads_user_content = false
performed_by = "agent"
user_types_commands = false
support_status = "optional_candidate_requires_external_acceptance"
install_order = 41
verify_commands = [
  "ollama --version",
  "ollama list",
  "sources/rag/.venv/bin/python -c \"import lancedb, pyarrow, jieba, pypdf, requests\"",
]
replaceable = true

[[providers.components]]
id = "ollama"
kind = "runtime"
package = "ollama"
install_method = "homebrew_formula"
install_commands = ["brew install ollama", "brew services start ollama"]
autostart = "brew_services"
source = "https://formulae.brew.sh/formula/ollama"
upstream = "https://github.com/ollama/ollama"
license_spdx = "MIT"
license_url = "https://github.com/ollama/ollama/blob/main/LICENSE"
tier = "C"
version_policy = "latest"
tier_reason = "平台相依的本機服務，由 Homebrew 安裝與更新；不是工具包的一部分"
external_source_notice = "standard"

[[providers.components]]
id = "qwen3-embedding-4b"
kind = "model_weights"
model = "qwen3-embedding:4b"
install_commands = ["ollama pull qwen3-embedding:4b"]
approx_download_gb = 2.5
source = "https://ollama.com/library/qwen3-embedding"
upstream = "https://huggingface.co/Qwen/Qwen3-Embedding-4B"
license_spdx = "Apache-2.0"
license_url = "https://huggingface.co/Qwen/Qwen3-Embedding-4B/blob/main/LICENSE"
tier = "C"
version_policy = "latest"
tier_reason = "模型權重體積大且由 Ollama 模型庫提供，不得提交進技能包"
external_source_notice = "standard"
cost = "free"

[[providers.components]]
id = "rag-python-packages"
kind = "python_packages"
packages = ["lancedb", "pyarrow", "jieba", "pypdf", "requests"]
licenses = ["Apache-2.0", "Apache-2.0", "MIT", "BSD-3-Clause", "Apache-2.0"]
install_method = "uv_venv_in_workspace"
install_commands = [
  "uv venv sources/rag/.venv --python 3.12",
  "uv pip install --python sources/rag/.venv/bin/python lancedb pyarrow jieba pypdf requests",
]
approx_disk_mb = 500
source = "https://pypi.org/"
tier = "C"
version_policy = "latest"
tier_reason = "PyPI 套件與平台相依的二進位檔無法封存；安裝在工作區的獨立 Python 環境，不碰系統 Python"
external_source_notice = "standard"

[upgrade_from_notebooklm]
applies_to = "已安裝 0.1.x 並曾使用 NotebookLM／notebooklm-py 的使用者"
notebooklm_remote_data = "keep_untouched"
notebooklm_py_package = "may_stay_installed_no_forced_uninstall"
notebooklm_project_skills = "may_stay_no_forced_uninstall"
legacy_local_index = "sources/references/notebooks/ 保留為歷史紀錄，不再同步"
optional_source_download = "使用者同意後，協助把 NotebookLM 的原始來源下載或匯出到 sources/inbox/，再走一般收件匣流程"
graphifyignore = "preview_replace_wiki_line_and_append_missing_then_confirm"
graphifyignore_replace = { from = "wiki/", to = ["wiki/*", "!wiki/ext_*.md"] }
graphifyignore_append_missing = ["inbox/", "external/", "rag/"]
graphifyignore_note = "舊的 wiki/ 這一行必須刪除並換成 wiki/* 與 !wiki/ext_*.md；只附加新行而保留 wiki/ 時，gitignore 規則會讓 ext_*.md 仍被排除"

[[install_steps]]
order = 10
id = "read_instructions"
action = "read"
inputs = ["AGENTS.md", "INSTALL.md", "install.manifest.toml", "docs/installation.md", "docs/providers.md", "docs/integrations/local-rag.md"]
requires_confirmation = false

[[install_steps]]
order = 20
id = "inspect_environment"
action = "preflight"
requires_confirmation = false

[[install_steps]]
order = 25
id = "confirm_changes"
action = "approval_gate"
requires_confirmation = true

[[install_steps]]
order = 30
id = "install_self_skills"
action = "install_skills"
source = "skills"
scope_from = "defaults.self_skill_scope"
requires_confirmation = true

[[install_steps]]
order = 35
id = "initialize_workspace"
action = "merge_template"
source = "workspace.template_path"
target_from = "workspace.target"
conflict_policy_from = "workspace.copy_policy"
requires_confirmation = true

[[install_steps]]
order = 40
id = "install_provider_packages"
action = "install_providers"
source = "providers"
requires_confirmation = true

[[install_steps]]
order = 50
id = "install_provider_skills"
action = "install_provider_skills"
scope_from = "defaults.provider_skill_scope"
requires_confirmation = true

[[install_steps]]
order = 60
id = "install_local_rag"
action = "install_local_rag"
provider = "local_rag"
performed_by = "agent"
steps = ["homebrew_ollama", "brew_services_autostart", "pull_embedding_model", "create_workspace_venv", "install_python_packages"]
requires_confirmation = true

[[install_steps]]
order = 70
id = "verify_installation"
action = "verify"
requires_confirmation = false

[[verification_steps]]
order = 10
id = "verify_self_skills"
checks = ["all_required_skill_paths_exist", "frontmatter_name_matches_skill_id"]

[[verification_steps]]
order = 15
id = "verify_workspace"
checks = ["all_required_workspace_directories_exist", "existing_user_files_not_overwritten", "workspace_instructions_exist"]

[[verification_steps]]
order = 20
id = "verify_provider_versions"
checks = ["installed_provider_versions_match_manifest"]

[[verification_steps]]
order = 30
id = "verify_provider_skills"
checks = ["provider_skills_exist_in_selected_project_scope"]

[[verification_steps]]
order = 40
id = "verify_local_rag"
checks = ["ollama_service_running", "embedding_model_listed", "venv_imports_ok", "inbox_and_external_exist", "sample_ingest_and_query_ok_in_temporary_root"]

[[verification_steps]]
order = 50
id = "write_local_state"
checks = ["state_contains_no_credentials", "state_is_gitignored"]
